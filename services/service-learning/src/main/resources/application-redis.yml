spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: wang15915  # 生产环境务必设置密码
      database: 0       # 数据库索引
      timeout: 10s      # 命令执行超时时间

      # Lettuce 连接池配置（生产必备）
      lettuce:
        pool:
          enabled: true          # 必须开启，否则为单连接
          max-active: 20         # 最大连接数
          max-idle: 10           # 最大空闲连接数
          min-idle: 2            # 最小空闲连接数
          max-wait: 3000ms       # 获取连接的最大等待时间